<main id="top">
<!-- Pasted from sections/hero/section.html. Regenerate this block if the fragment changes. -->
<!-- Hero: type only on light concrete. Huge name, the lede, "Let's talk" with the email, and a black band with the headline scrolling sideways. Styles: sections/hero/section.css, script: sections/hero/section.js -->
<section class="hx" id="hero" aria-labelledby="hx-title">
  <div class="hx-grain" aria-hidden="true"></div>

  <div class="hx-inner">
    <h1 class="hx-title" id="hx-title"><span class="hx-name"><span>Cole</span> <span>Stepanik</span></span><span class="hx-sr"> does the work, then automates it.</span></h1>
    <div class="hx-sub">
      <p class="hx-lede">Finance and Accounting senior at UMass Lowell. I cold call business owners for a search fund, so I built the workspace I wanted: Ownerhound.</p>
      <p class="hx-talk"><span class="hx-talk-k">Let's talk</span> <a class="hx-mail" href="mailto:colestepanik39@gmail.com">colestepanik39@gmail.com</a></p>
    </div>
  </div>

  <!-- Photos from competitions and club events. The second group is a copy, so the loop has no seam. -->
  <div class="hx-band hx-band--photos">
    <div class="hx-track">
      <div class="hx-group"><img src="img/hero/band/gimage.webp" width="237" height="420" alt="Cole with fellow students at a business school event" decoding="async"><img src="img/hero/band/g4.webp" width="315" height="420" alt="The UMass Lowell Sales Team at the Medicus sales competition" decoding="async"><img src="img/hero/band/g9.webp" width="630" height="420" alt="Cole and teammates walking through an office in suits" decoding="async"><img src="img/hero/band/g12.webp" width="318" height="420" alt="Cole holding a presentation check at a Manning School of Business event" decoding="async"><img src="img/hero/band/g7.webp" width="315" height="420" alt="Cole and teammates holding award certificates" decoding="async"><img src="img/hero/band/g6.webp" width="560" height="420" alt="Cole with classmates and an industry guest" decoding="async"><img src="img/hero/band/g11.webp" width="630" height="420" alt="Cole in a meeting across the table from a professional" decoding="async"><img src="img/hero/band/g15.webp" width="560" height="420" alt="Group photo at a Manning Leaders Discussion event" decoding="async"><img src="img/hero/band/g8.webp" width="315" height="420" alt="Cole and three teammates holding award certificates" decoding="async"><img src="img/hero/band/g18.webp" width="560" height="420" alt="Cole with classmates on a rooftop under the Citgo sign in Boston" decoding="async"><img src="img/hero/band/g3.webp" width="560" height="420" alt="Cole working on a case in a conference room" decoding="async"><img src="img/hero/band/g14.webp" width="560" height="420" alt="Students and faculty at an awards event" decoding="async"></div>
      <div class="hx-group" aria-hidden="true"><img src="img/hero/band/gimage.webp" width="237" height="420" alt="" decoding="async"><img src="img/hero/band/g4.webp" width="315" height="420" alt="" decoding="async"><img src="img/hero/band/g9.webp" width="630" height="420" alt="" decoding="async"><img src="img/hero/band/g12.webp" width="318" height="420" alt="" decoding="async"><img src="img/hero/band/g7.webp" width="315" height="420" alt="" decoding="async"><img src="img/hero/band/g6.webp" width="560" height="420" alt="" decoding="async"><img src="img/hero/band/g11.webp" width="630" height="420" alt="" decoding="async"><img src="img/hero/band/g15.webp" width="560" height="420" alt="" decoding="async"><img src="img/hero/band/g8.webp" width="315" height="420" alt="" decoding="async"><img src="img/hero/band/g18.webp" width="560" height="420" alt="" decoding="async"><img src="img/hero/band/g3.webp" width="560" height="420" alt="" decoding="async"><img src="img/hero/band/g14.webp" width="560" height="420" alt="" decoding="async"></div>
    </div>
  </div>
</section>
<div class="demo-next" id="ownerhound">Next section (black)</div>
</main>
<script>
(function () {
  var nav = document.getElementById('nav');
  var s = document.createElement('div');
  s.style.cssText = 'position:absolute;top:0;height:40px;width:1px;pointer-events:none';
  document.body.prepend(s);
  new IntersectionObserver(function (e) { nav.classList.toggle('scrolled', !e[0].isIntersecting); }).observe(s);
})();
</script>
<script src="sections/hero/section.js"></script>
